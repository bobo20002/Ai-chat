<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Ai bot</title>
<style>
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
:root{--bg:#f3f4fb;--panel:rgba(255,255,255,.78);--ink:#14172b;--mute:#6b7190;--line:rgba(20,23,43,.1);--blue:#0a84ff;--violet:#bf5af2;--pink:#ff375f;--me1:#0a84ff;--me2:#7d5cff;--bot:#fff;--shadow:0 10px 32px rgba(40,50,120,.12)}
@media (prefers-color-scheme:dark){:root{--bg:#07081a;--panel:rgba(24,26,54,.72);--ink:#eef0ff;--mute:#9399bd;--line:rgba(255,255,255,.11);--bot:#161936;--shadow:0 10px 32px rgba(0,0,0,.45)}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;max-width:760px;margin:0 auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-font-smoothing:antialiased}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--panel);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
header h1{font-size:17px;font-weight:650;margin:0;flex:1;letter-spacing:-.015em}
button{font:inherit;color:inherit;cursor:pointer}
.ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:14px;transition:border-color .2s,background .2s}
.ghost:hover{border-color:var(--blue);background:rgba(10,132,255,.08)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
/* Siri-style orb */
.orb{--s:28px;position:relative;display:inline-block;width:var(--s);height:var(--s);border-radius:50%;overflow:hidden;background:#0b0d24;flex:none;isolation:isolate;box-shadow:0 0 calc(var(--s)*.6) rgba(125,92,255,.55)}
.orb i{position:absolute;width:75%;height:75%;border-radius:50%;filter:blur(calc(var(--s)*.2));mix-blend-mode:screen;animation:orbit 6s linear infinite}
.orb i:nth-child(1){background:#0a84ff;top:-8%;left:-8%}
.orb i:nth-child(2){background:#bf5af2;bottom:-8%;right:-8%;animation-duration:8s;animation-direction:reverse}
.orb i:nth-child(3){background:#ff375f;top:28%;left:30%;animation-duration:4.5s}
.orb.live i{animation-duration:2.4s}.orb.live i:nth-child(2){animation-duration:3.2s}.orb.live i:nth-child(3){animation-duration:1.8s}
.orb.live{animation:pulse 1.4s ease-in-out infinite}
.orb.lg{--s:104px}
@keyframes orbit{from{transform:rotate(0) translateX(18%) rotate(0)}to{transform:rotate(360deg) translateX(18%) rotate(-360deg)}}
@keyframes pulse{50%{transform:scale(1.12)}}
/* screen-edge glow while thinking */
#glow{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .6s;padding:3px;background:conic-gradient(from var(--a),#0a84ff,#bf5af2,#ff375f,#ff9f0a,#64d2ff,#0a84ff);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);filter:blur(7px);z-index:5}
body.busy #glow{opacity:.95;animation:spin 3.2s linear infinite}
@keyframes spin{to{--a:360deg}}
#log{flex:1;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
.empty{margin:auto;text-align:center;color:var(--mute);max-width:30ch;display:flex;flex-direction:column;align-items:center;gap:18px}
.empty b{color:var(--ink);font-size:22px;letter-spacing:-.02em}
.msg{max-width:86%;padding:10px 15px;border-radius:20px;white-space:pre-wrap;overflow-wrap:anywhere;animation:in .25s ease-out}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.msg.user{align-self:flex-end;background:linear-gradient(135deg,var(--me1),var(--me2));color:#fff;border-bottom-right-radius:6px}
.msg.bot{align-self:flex-start;background:var(--bot);border:1px solid var(--line);border-bottom-left-radius:6px;box-shadow:var(--shadow)}
.msg.err{align-self:flex-start;background:transparent;border:1px solid #ff453a;color:#ff453a}
.msg img{display:block;max-width:100%;border-radius:12px;margin-top:8px}
.msg a.dl{display:inline-block;margin-top:6px;font-size:14px;color:var(--blue);text-decoration:none}
.msg code{background:rgba(127,127,160,.2);padding:1px 5px;border-radius:5px;font-family:ui-monospace,Menlo,monospace;font-size:.92em}
.msg.typing{display:flex;align-items:center;gap:12px;padding:10px 18px 10px 12px}
.shimmer{background:linear-gradient(90deg,var(--mute) 35%,var(--ink) 50%,var(--mute) 65%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 1.6s linear infinite}
@keyframes sh{to{background-position:-220% 0}}
form{margin:6px 12px 12px;padding:10px 10px 10px 14px;border:1px solid var(--line);border-radius:26px;background:var(--panel);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:var(--shadow)}
.modes{display:flex;gap:6px;margin-bottom:8px;align-items:center}
.modes button:not(.ghost){border:1px solid var(--line);background:none;border-radius:999px;padding:4px 13px;font-size:14px;transition:all .2s}
.modes button[aria-pressed=true]{background:linear-gradient(135deg,var(--me1),var(--me2));color:#fff;border-color:transparent;font-weight:600}
.row{display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;resize:none;max-height:140px;font:inherit;color:inherit;background:transparent;border:0;outline:0;padding:8px 2px}
.send{background:linear-gradient(135deg,var(--me1),var(--me2));color:#fff;border:0;border-radius:999px;padding:9px 18px;font-weight:600;transition:transform .15s,opacity .2s}
.send:active{transform:scale(.95)}
.send:disabled{opacity:.45;cursor:default}
#send{width:40px;height:40px;padding:0;display:grid;place-items:center;flex:none}
.thumb{display:none;align-items:center;gap:8px;margin-bottom:8px;font-size:14px;color:var(--mute)}
.thumb img{height:44px;border-radius:8px}
dialog{border:1px solid var(--line);border-radius:22px;background:var(--bot);color:var(--ink);width:min(440px,92vw);padding:20px;box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(8,10,28,.55);backdrop-filter:blur(4px)}
label{display:block;font-size:14px;font-weight:600;margin:14px 0 4px}
input,select{width:100%;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.hint{font-size:13px;color:var(--mute);margin:6px 0 0}
.hint a{color:var(--blue)}
.actions{display:flex;justify-content:space-between;margin-top:18px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <span class="orb" aria-hidden="true"><i></i><i></i><i></i></span>
  <h1>My Ai bot</h1>
  <button class="ghost" id="clear" type="button">Rensa</button>
  <button class="ghost" id="open-settings" type="button">Inställningar</button>
</header>

<div id="glow" aria-hidden="true"></div>
<main id="log" aria-live="polite"></main>

<form id="form">
  <div class="modes" role="group" aria-label="Läge">
    <button type="button" id="m-chat" aria-pressed="true">Chatt</button>
    <button type="button" id="m-img" aria-pressed="false">Bild</button>
    <button type="button" class="ghost" id="attach" style="margin-left:auto">Bifoga bild</button>
    <input type="file" id="file" accept="image/*" hidden>
  </div>
  <div class="thumb" id="thumb"><img id="thumb-img" alt=""><span>Bifogad bild</span><button type="button" class="ghost" id="thumb-x">Ta bort</button></div>
  <div class="row">
    <textarea id="input" rows="1" placeholder="Skriv ett meddelande…" aria-label="Meddelande"></textarea>
    <button class="send" id="send" type="submit" aria-label="Skicka"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
  </div>
</form>

<dialog id="settings">
  <h2 style="margin:0 0 4px;font-size:18px">Inställningar</h2>
  <p class="hint">Nyckeln sparas bara i den här webbläsaren och skickas direkt till Google.</p>
  <label for="key">Google API-nyckel</label>
  <input id="key" type="password" autocomplete="off" placeholder="AIza…">
  <p class="hint">Skapa en gratis nyckel i <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Google AI Studio</a>.</p>
  <label for="tmodel">Textmodell (Gemini)</label>
  <select id="tmodel">
    <option value="gemini-2.5-flash">Gemini 2.5 Flash (snabb)</option>
    <option value="gemini-2.5-flash-lite">Gemini 2.5 Flash-Lite (snabbast)</option>
    <option value="gemini-2.5-pro">Gemini 2.5 Pro (smartast)</option>
    <option value="gemini-flash-latest">Gemini Flash (senaste)</option>
  </select>
  <label for="imodel">Bildmodell (Nano Banana)</label>
  <select id="imodel">
    <option value="gemini-2.5-flash-image">Nano Banana (2.5 Flash Image)</option>
    <option value="gemini-3-pro-image-preview">Nano Banana Pro (3 Pro Image)</option>
  </select>
  <label for="sys">Systeminstruktion (valfri)</label>
  <input id="sys" placeholder="T.ex. Svara kort och på svenska.">
  <div class="actions">
    <button type="button" class="ghost" id="cancel">Avbryt</button>
    <button type="button" class="send" id="save">Spara</button>
  </div>
</dialog>

<script>
const $ = id => document.getElementById(id);
const DEF = {key:"", tmodel:"gemini-2.5-flash", imodel:"gemini-2.5-flash-image", sys:"Svara på samma språk som användaren."};
let cfg = {...DEF}, mode = "chat", attached = null, history = [], busy = false;

try { Object.assign(cfg, JSON.parse(localStorage.getItem("bc-cfg") || "{}")); } catch(e){}
try { history = JSON.parse(localStorage.getItem("bc-hist") || "[]"); } catch(e){}

function persist(){
  try { localStorage.setItem("bc-hist", JSON.stringify(history.slice(-40).map(m => ({...m, img: undefined})))); } catch(e){}
}
function esc(s){ return s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function fmt(s){ return esc(s).replace(/`([^`\n]+)`/g,"<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g,"<b>$1</b>"); }

function render(){
  const log = $("log"); log.innerHTML = "";
  if(!history.length){
    log.innerHTML = '<div class="empty"><span class="orb lg"><i></i><i></i><i></i></span><p><b>Hej!</b><br>Chatta med Gemini, eller växla till Bild för att skapa och redigera bilder med Nano Banana.</p></div>';
    return;
  }
  history.forEach(m => log.appendChild(bubble(m)));
  log.scrollTop = log.scrollHeight;
}
function bubble(m){
  const d = document.createElement("div");
  d.className = "msg " + (m.err ? "err" : m.role === "user" ? "user" : "bot");
  let h = m.text ? fmt(m.text) : "";
  d.innerHTML = h;
  (m.imgs || []).forEach((src,i) => {
    const wrap = document.createElement("div");
    const im = document.createElement("img"); im.src = src; im.alt = "Bild";
    const a = document.createElement("a"); a.className = "dl"; a.href = src; a.download = "bild-" + Date.now() + ".png"; a.textContent = "Ladda ner";
    wrap.append(im, a); d.appendChild(wrap);
  });
  return d;
}
function setMode(m){
  mode = m;
  $("m-chat").setAttribute("aria-pressed", m === "chat");
  $("m-img").setAttribute("aria-pressed", m === "img");
  $("input").placeholder = m === "chat" ? "Skriv ett meddelande…" : "Beskriv bilden du vill skapa eller ändra…";
}
$("m-chat").onclick = () => setMode("chat");
$("m-img").onclick = () => setMode("img");

$("attach").onclick = () => $("file").click();
$("file").onchange = e => {
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    attached = {mime: f.type, data: r.result.split(",")[1], url: r.result};
    $("thumb-img").src = r.result; $("thumb").style.display = "flex";
  };
  r.readAsDataURL(f); e.target.value = "";
};
$("thumb-x").onclick = () => { attached = null; $("thumb").style.display = "none"; };

$("input").addEventListener("input", e => { e.target.style.height = "auto"; e.target.style.height = Math.min(e.target.scrollHeight,140) + "px"; });
$("input").addEventListener("keydown", e => { if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); $("form").requestSubmit(); } });

$("clear").onclick = () => { history = []; persist(); render(); };

const dlg = $("settings");
function pick(id, val){
  const s = $(id);
  if(![...s.options].some(o => o.value === val)) s.add(new Option(val, val));
  s.value = val;
}
$("open-settings").onclick = () => { $("key").value = cfg.key; pick("tmodel", cfg.tmodel); pick("imodel", cfg.imodel); $("sys").value = cfg.sys; dlg.showModal(); };
$("cancel").onclick = () => dlg.close();
$("save").onclick = () => {
  cfg = {key:$("key").value.trim(), tmodel:$("tmodel").value.trim() || DEF.tmodel, imodel:$("imodel").value.trim() || DEF.imodel, sys:$("sys").value.trim()};
  try { localStorage.setItem("bc-cfg", JSON.stringify(cfg)); } catch(e){}
  dlg.close();
};

async function callGemini(model, contents, withImage){
  const body = {contents};
  if(cfg.sys && !withImage) body.systemInstruction = {parts:[{text:cfg.sys}]};
  if(withImage) body.generationConfig = {responseModalities:["TEXT","IMAGE"]};
  const res = await fetch("https://generativelanguage.googleapis.com/v1beta/models/" + encodeURIComponent(model) + ":generateContent", {
    method:"POST",
    headers:{"Content-Type":"application/json","x-goog-api-key":cfg.key},
    body: JSON.stringify(body)
  });
  const data = await res.json();
  if(!res.ok) throw new Error(data.error && data.error.message || ("Fel " + res.status));
  const parts = (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts) || [];
  const out = {text:"", imgs:[]};
  parts.forEach(p => {
    if(p.text) out.text += p.text;
    const inl = p.inlineData || p.inline_data;
    if(inl) out.imgs.push("data:" + (inl.mimeType || inl.mime_type || "image/png") + ";base64," + inl.data);
  });
  if(!out.text && !out.imgs.length){
    const why = data.promptFeedback && data.promptFeedback.blockReason || (data.candidates && data.candidates[0] && data.candidates[0].finishReason);
    throw new Error("Tomt svar" + (why ? " (" + why + ")" : "") + ". Prova att formulera om.");
  }
  return out;
}

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  if(busy) return;
  const text = $("input").value.trim();
  if(!text && !attached) return;
  if(!cfg.key){ $("open-settings").click(); return; }

  const userMsg = {role:"user", text: text, imgs: attached ? [attached.url] : []};
  const parts = [];
  if(attached) parts.push({inlineData:{mimeType:attached.mime, data:attached.data}});
  if(text) parts.push({text});
  const useImage = mode === "img";

  // Build context from earlier text turns
  const contents = history.filter(m => !m.err && m.text).slice(-16).map(m => ({role: m.role === "user" ? "user" : "model", parts:[{text:m.text}]}));
  if(useImage) contents.length = 0; // image generation works best from the current prompt only
  contents.push({role:"user", parts});

  history.push(userMsg);
  $("input").value = ""; $("input").style.height = "auto";
  attached = null; $("thumb").style.display = "none";
  busy = true; $("send").disabled = true; document.body.classList.add("busy"); render();
  const wait = document.createElement("div"); wait.className = "msg bot typing"; wait.innerHTML = '<span class="orb live"><i></i><i></i><i></i></span><span class="shimmer">' + (useImage ? "Skapar bild…" : "Tänker…") + '</span>';
  $("log").appendChild(wait); $("log").scrollTop = $("log").scrollHeight;

  try {
    const out = await callGemini(useImage ? cfg.imodel : cfg.tmodel, contents, useImage);
    history.push({role:"model", text: out.text, imgs: out.imgs});
  } catch(err){
    history.push({role:"model", err:true, text: err.message});
  }
  busy = false; $("send").disabled = false; document.body.classList.remove("busy"); persist(); render();
});

render();
</script>
</body>
</html>
